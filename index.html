<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Unity Web Player | MvLO-DotMod</title>
    <style>
      /* Basic settings: Dark theme */
      body {
        margin: 0;
        padding: 0;
        background-color: #1a1a1a;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #eee;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* Game container: Centered and shadow */
      #game-container {
        position: relative;
        width: 960px;
        max-width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        border-radius: 4px;
        overflow: hidden;
      }

      /* Canvas: Stretch to fit container */
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #232323; /* Background color before load */
        display: block;
      }

      /* Loading overlay */
      #loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        transition: opacity 0.5s ease;
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 10px;
      }

      .loading-text {
        font-size: 14px;
        color: #ccc;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Control bar (Footer) */
      #controls-bar {
        width: 960px;
        max-width: 100%;
        background-color: #2a2a2a;
        padding: 10px 15px;
        box-sizing: border-box;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom-left-radius: 4px;
        border-bottom-right-radius: 4px;
        margin-top: -4px; /* Fill gap with Canvas */
      }

      .title {
        font-weight: bold;
        font-size: 1.1em;
      }

      .fullscreen-btn {
        background-color: #444;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.2s;
        font-size: 0.9em;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .fullscreen-btn:hover {
        background-color: #666;
      }

      .fullscreen-btn svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      /* Mobile support */
      @media (max-width: 960px) {
        #game-container {
          width: 100%;
          border-radius: 0;
        }
        #controls-bar {
          width: 100%;
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>

    <!-- Game display area -->
    <div id="game-container">
      <canvas id="unity-canvas" width="960" height="540" tabindex="-1"></canvas>
      
      <!-- Loading screen -->
      <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Loading...</div>
      </div>
    </div>

    <!-- Bottom control bar -->
    <div id="controls-bar">
      <div class="title">MvLO-DotMod <span style="font-size:0.8em; color:#888; margin-left:10px;">v2.0.7.0</span></div>
      <button id="fullscreen-btn" class="fullscreen-btn" onclick="toggleFullscreen()">
        <!-- Fullscreen icon SVG -->
        <svg viewBox="0 0 24 24">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
        Fullscreen
      </button>
    </div>

    <!-- Unity Loader Script -->
    <!-- Note: This script will error if the Unity Build folder does not exist, but will work if placed correctly -->
    <script src="Build/webdotmod.loader.js"></script>
    
    <script>
      var container = document.querySelector("#game-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingOverlay = document.querySelector("#loading-overlay");
      var fullscreenBtn = document.querySelector("#fullscreen-btn");

      // Mobile detection
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        
        // Force container to fullscreen on mobile, adjust as needed
        container.style.width = "100%";
        container.style.height = "100%";
        container.style.position = "fixed";
        container.style.top = "0";
        container.style.left = "0";
      }

      // Unity instance creation process
      // Assumes loader.js is loaded via script tag
      if (typeof createUnityInstance !== 'undefined') {
        createUnityInstance(canvas, {
          arguments: [],
          dataUrl: "Build/webdotmod.data.unityweb",
          frameworkUrl: "Build/webdotmod.framework.js.unityweb",
          codeUrl: "Build/webdotmod.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "ipodtouch0218",
          productName: "MvLO-DotMod",
          productVersion: "2.0.7.0",
          // matchWebGLToCanvasSize: false, 
          // devicePixelRatio: 1,
        }).then((unityInstance) => {
          // Process when load is complete
          loadingOverlay.style.opacity = "0";
          setTimeout(() => {
            loadingOverlay.style.display = "none";
          }, 500);

          // Fullscreen toggle function
          window.unityInstance = unityInstance; // For global access
        }).catch((message) => {
          console.error(message);
          // Change loading text on error
          document.querySelector(".loading-text").innerText = "Error Loading Game";
          document.querySelector(".loading-text").style.color = "#ff5555";
        });
      } else {
        // Dummy display for preview environment (when Build folder is missing)
        console.warn("Unity Loader not found. Ensure Build/webdotmod.loader.js exists.");
        setTimeout(() => {
            // Dummy load completion action
            // loadingOverlay.style.opacity = "0"; // Actually keep it visible (since files are missing)
            document.querySelector(".loading-text").innerText = "Unity Files Not Found (Check Build folder)";
        }, 2000);
      }

      // Fullscreen logic
      function toggleFullscreen() {
        if (typeof window.unityInstance !== 'undefined') {
           // When using Unity's standard fullscreen feature
           window.unityInstance.SetFullscreen(1);
        } else {
           // Fullscreen fallback as HTML element
           if (!document.fullscreenElement) {
            container.requestFullscreen().catch(err => {
              console.error(`Error attempting to enable full-screen mode: ${err.message}`);
            });
          } else {
            document.exitFullscreen();
          }
        }
      }
    </script>
  </body>
</html>
